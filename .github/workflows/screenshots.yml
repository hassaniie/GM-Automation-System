# Re-record the visual-regression baselines on a GitHub runner, so they match how CI renders text.
# Run it by hand (Actions → Update screenshots → Run workflow) after an intended visual change, then
# download the "mg-andon-screenshots" artifact into apps/web/e2e/__screenshots__ and commit it.
name: Update screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from package.json)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:demo
      - run: pnpm --filter @mg/web build-storybook
      - run: pnpm --filter @mg/web exec playwright install --with-deps chromium
      - run: pnpm --filter @mg/web exec playwright test e2e/visual.spec.ts --trace off --update-snapshots=all
      - name: Upload the recorded baselines
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mg-andon-screenshots
          path: apps/web/e2e/__screenshots__
          retention-days: 7
