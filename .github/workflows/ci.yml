name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mg
          POSTGRES_PASSWORD: mg
          POSTGRES_DB: mg_andon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mg" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # the edge tests create and drop a throwaway database per test file
      TEST_DATABASE_URL: postgres://mg:mg@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from package.json)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:demo
      - run: pnpm --filter @mg/web build:edge
      # design-system guardrail: the top bar and the station strip fit at every supported width, both themes
      - run: pnpm --filter @mg/web exec playwright install --with-deps chromium
      - run: pnpm --filter @mg/web exec playwright test --trace off
      - run: pnpm --filter @mg/web build-storybook
      - name: Upload Storybook (design system catalogue)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mg-andon-storybook
          path: apps/web/storybook-static
          retention-days: 14
      - name: Upload single-file demo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mg-andon-demo
          path: apps/web/dist-demo/index.html
          retention-days: 14
