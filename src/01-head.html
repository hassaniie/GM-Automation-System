<title>MG GA Line HS ZS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* v3 "Edge": sharp-cornered variation. Layout: the floor fills the window; one flush HUD bar on top, the line
   strip flush at the bottom, full-height inspector and drawer planes on the right. Hairlines, zero radius,
   corner registration marks on floating panels. (Original v2 note:) Instruments float above it as thick-glass
   islands: identity + clock (top-left), line state (top-centre), actions (top-right), the line strip
   (bottom), the simulation console (bottom-right) and inspectors (right) that appear only when needed.
   Monochrome and type-led; colour is reserved for state. */
:root {
  color-scheme: light;
  --bg: #e8ebee;
  --text: #0f1215;
  --text-2: #3a434c;
  --muted: #6a747e;
  --hair: rgba(16, 22, 28, .10);
  --hair-2: rgba(16, 22, 28, .18);
  --fill: rgba(16, 22, 28, .05);
  --fill-2: rgba(16, 22, 28, .09);
  --glass: linear-gradient(180deg, rgba(255,255,255,.74), rgba(244,246,248,.56));
  --glass-solid: rgba(246,247,249,.94);
  --glass-rim: linear-gradient(160deg, rgba(255,255,255,1), rgba(255,255,255,.35) 38%, rgba(255,255,255,.08) 62%, rgba(255,255,255,.6));
  --glass-edge: rgba(16, 22, 28, .10);
  --glass-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 -1px 0 rgba(16,22,28,.04) inset, 0 26px 60px -24px rgba(20, 28, 38, .38), 0 6px 18px -8px rgba(20, 28, 38, .16);
  --brand: #c8102e;
  --ok: #1f9a66; --warn: #c27f05; --crit: #e03535; --esc: #cc1d5b; --hold: #4a62e0; --transit: #0f8ea6; --paused: #6e7b88;
  --sim: #a07b06;
  --call-sup: #7a4fe0; --call-mnt: #0a7fd6; --andon-ok: #1f9a66;
  --chart-a: #3f7fd0; --chart-b: #c8622f;
  --primary-bg: #0f1215; --primary-fg: #ffffff;
  --font-ui: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 14px;
  --blur: blur(26px) saturate(175%);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #0c1014; --text: #f2f4f6; --text-2: #c3cad1; --muted: #8b959f;
  --hair: rgba(255,255,255,.08); --hair-2: rgba(255,255,255,.15); --fill: rgba(255,255,255,.05); --fill-2: rgba(255,255,255,.09);
  --glass: linear-gradient(180deg, rgba(34,38,44,.58), rgba(14,16,19,.46));
  --glass-solid: rgba(18,20,24,.95);
  --glass-rim: linear-gradient(160deg, rgba(255,255,255,.34), rgba(255,255,255,.06) 36%, rgba(255,255,255,0) 60%, rgba(255,255,255,.14));
  --glass-edge: rgba(0,0,0,.45);
  --glass-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 30px 70px -24px rgba(0,0,0,.75), 0 8px 22px -10px rgba(0,0,0,.6);
  --ok: #3fc28a; --warn: #f0a92a; --crit: #ff5452; --esc: #ff4688; --hold: #93a6ff; --transit: #50c4d8; --paused: #9aa6b2; --sim: #e2be52; --call-sup: #b394ff; --call-mnt: #4fb4ff; --andon-ok: #3fc28a;
  --chart-a: #4f8fd6; --chart-b: #d0743f; --primary-bg: #f2f4f6; --primary-fg: #08090b;
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c1014; --text: #f2f4f6; --text-2: #c3cad1; --muted: #8b959f;
  --hair: rgba(255,255,255,.08); --hair-2: rgba(255,255,255,.15); --fill: rgba(255,255,255,.05); --fill-2: rgba(255,255,255,.09);
  --glass: linear-gradient(180deg, rgba(34,38,44,.58), rgba(14,16,19,.46));
  --glass-solid: rgba(18,20,24,.95);
  --glass-rim: linear-gradient(160deg, rgba(255,255,255,.34), rgba(255,255,255,.06) 36%, rgba(255,255,255,0) 60%, rgba(255,255,255,.14));
  --glass-edge: rgba(0,0,0,.45);
  --glass-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 30px 70px -24px rgba(0,0,0,.75), 0 8px 22px -10px rgba(0,0,0,.6);
  --ok: #3fc28a; --warn: #f0a92a; --crit: #ff5452; --esc: #ff4688; --hold: #93a6ff; --transit: #50c4d8; --paused: #9aa6b2; --sim: #e2be52; --call-sup: #b394ff; --call-mnt: #4fb4ff; --andon-ok: #3fc28a;
  --chart-a: #4f8fd6; --chart-b: #d0743f; --primary-bg: #f2f4f6; --primary-fg: #08090b;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 14px; line-height: 1.4; overflow: hidden; -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.ico { width: 16px; height: 16px; flex: none; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.micro { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.num { font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -.01em; line-height: 1; }

/* thick glass */
.glass { position: absolute; z-index: 10; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border-radius: var(--r); box-shadow: var(--glass-shadow); border: 1px solid var(--glass-edge); }
.glass::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.25px; background: var(--glass-rim); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: var(--glass-solid); } }

#app { position: fixed; inset: 0; padding-top: env(safe-area-inset-top, 0px); }
.stage { position: absolute; inset: 0; overflow: hidden; }
#scene { position: absolute; inset: 0; }
#scene canvas { display: block; width: 100%; height: 100%; outline: none; }
.gutter-l { left: max(16px, env(safe-area-inset-left, 0px)); }
.gutter-r { right: max(16px, env(safe-area-inset-right, 0px)); }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--hair-2); background: var(--fill); color: var(--text); font-size: 13px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { background: var(--fill-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--primary-bg); color: var(--primary-fg); border-color: transparent; }
.btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 45%, transparent); }
.btn.danger:hover { background: color-mix(in srgb, var(--crit) 10%, transparent); }
.btn.sim { border-style: dashed; border-color: color-mix(in srgb, var(--sim) 60%, transparent); color: var(--sim); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--fill); color: var(--text); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn.icon { width: 34px; padding: 0; justify-content: center; }
.btn.sm.icon { width: 28px; }
.ibtn { width: 38px; height: 38px; border-radius: 10px; border: 0; background: transparent; color: var(--text-2); display: grid; place-items: center; position: relative; }
.ibtn:hover { background: var(--fill); color: var(--text); }
.ibtn[aria-pressed="true"] { background: var(--fill-2); color: var(--text); }
.ibtn .ico { width: 18px; height: 18px; }

/* islands */
.id-island { top: 14px; padding: 12px 18px 14px; display: grid; gap: 10px; min-width: 250px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand-name { font-size: 15px; font-weight: 600; letter-spacing: .04em; }
.brand-sub { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.clock { display: flex; align-items: baseline; gap: 10px; }
.clock .num { font-size: 34px; }
.shiftbar { height: 2px; background: var(--hair); border-radius: 2px; overflow: hidden; }
.shiftbar i { display: block; height: 100%; background: var(--text); }
.state-island { top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: stretch; padding: 10px 6px; max-width: calc(100vw - 32px); }
.metric { padding: 2px 18px; display: grid; gap: 6px; align-content: center; border-left: 1px solid var(--hair); min-width: 0; }
.metric:first-child { border-left: 0; }
.metric .v { font-size: 24px; font-weight: 300; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.metric .v small { font-size: 13px; color: var(--muted); font-weight: 500; }
.linestate { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; background: none; border: 0; padding: 0; text-align: left; }
.linestate .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 18%, transparent); }
.linestate.crit .dot { animation: breathe 1.4s ease-in-out infinite; }
@keyframes breathe { 50% { box-shadow: 0 0 0 9px color-mix(in srgb, currentColor 0%, transparent); } }
.act-island { top: 14px; display: flex; align-items: center; gap: 2px; padding: 6px; }
.act-island .sep { width: 1px; align-self: stretch; background: var(--hair); margin: 6px 6px; }
.alarm-pill { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px 0 10px; border-radius: 10px; border: 0; background: transparent; font-weight: 600; font-size: 13px; letter-spacing: .04em; color: var(--text-2); }
.alarm-pill:hover { background: var(--fill); }
.alarm-pill .n { min-width: 22px; height: 22px; border-radius: 11px; padding: 0 6px; display: inline-grid; place-items: center; font-family: var(--font-mono); font-size: 12px; background: var(--fill-2); color: var(--text); }
.alarm-pill.hot { color: var(--crit); }
.alarm-pill.hot .n { background: var(--crit); color: #fff; }
.alarm-pill.ring .n { animation: pulse-n 1.4s ease-out infinite; }
@keyframes pulse-n { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--crit) 70%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
.sim-tag { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 10px; font-weight: 700; letter-spacing: .16em; color: var(--sim); border: 1px solid color-mix(in srgb, var(--sim) 50%, transparent); background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--sim) 14%, transparent) 0 5px, transparent 5px 10px); white-space: nowrap; }

/* line strip */
.strip { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); padding: 10px 12px 12px; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: end; }
.views { display: grid; grid-template-columns: repeat(2, auto); gap: 2px; }
.views button { height: 28px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; text-align: left; display: flex; gap: 6px; align-items: center; }
.views button:hover { color: var(--text); background: var(--fill); }
.views button[aria-pressed="true"] { color: var(--text); background: var(--fill-2); }
.lanes { display: flex; gap: 14px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.lane { display: grid; gap: 7px; min-width: 0; flex: var(--n) 1 0; }
.lane-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border: 0; background: none; padding: 0; color: inherit; text-align: left; }
.lane-h .micro:hover { color: var(--text); }
.cells { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(52px, 1fr); gap: 4px; }
.cell { display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; height: 64px; padding: 7px 7px 6px; border-radius: 8px; border: 1px solid transparent; background: var(--fill); text-align: left; min-width: 0; }
.cell .cin { display: grid; gap: 6px; }
.cell:hover { border-color: var(--hair-2); }
.cell[aria-pressed="true"] { border-color: var(--text); }
.cell .cid { font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--text-2); display: flex; justify-content: space-between; gap: 2px; white-space: nowrap; overflow: hidden; }
.cell .cid .ico { width: 12px; height: 12px; }
.cell .bar { height: 3px; border-radius: 2px; background: var(--hair); overflow: hidden; }
.cell .bar i { display: block; height: 100%; }
.cell .ct { font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell.x { background: color-mix(in srgb, var(--crit) 14%, var(--fill)); }
.cell.x .ct { color: var(--crit); }
.cell.w { background: color-mix(in srgb, var(--hold) 12%, var(--fill)); }
.cell.idle .cid { color: var(--muted); }

/* simulation console */
.simcon { left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(132px + env(safe-area-inset-bottom, 0px)); width: min(400px, calc(100vw - 32px)); border-style: dashed; border-color: color-mix(in srgb, var(--sim) 45%, transparent); z-index: 12; }
.simcon-bar { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; }
.speeds { display: flex; gap: 2px; background: var(--fill); border-radius: 8px; padding: 2px; margin-left: auto; }
.speeds button { height: 26px; min-width: 36px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.speeds button[aria-pressed="true"] { background: var(--primary-bg); color: var(--primary-fg); }
.simcon-body { border-top: 1px dashed var(--hair-2); padding: 12px; display: grid; gap: 16px; max-height: min(56vh, 540px); overflow: auto; }
.scn { width: 100%; text-align: left; display: grid; grid-template-columns: 22px 1fr; gap: 2px 8px; padding: 8px; border-radius: 8px; border: 0; background: transparent; }
.scn:hover { background: var(--fill); }
.scn[aria-current="true"] { background: var(--fill-2); }
.scn .n { font-family: var(--font-mono); color: var(--sim); font-size: 12px; padding-top: 2px; }
.scn .t { font-weight: 600; font-size: 14px; }
.scn .d { grid-column: 2; color: var(--muted); font-size: 12px; }
.cfg { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; font-size: 13px; }
.cfg label { color: var(--text-2); }
.cfg select, .cfg input[type=number] { background: var(--fill); border: 1px solid var(--hair-2); border-radius: 8px; height: 30px; padding: 0 8px; min-width: 0; }
.cfg input[type=number] { width: 72px; font-family: var(--font-mono); text-align: right; }
.toggle { position: relative; width: 38px; height: 22px; border-radius: 11px; background: var(--fill-2); border: 1px solid var(--hair-2); padding: 0; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.toggle[aria-checked="true"] { background: var(--primary-bg); }
.toggle[aria-checked="true"]::after { transform: translateX(16px); background: var(--primary-fg); }
.note { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0; }
.note b { color: var(--text-2); font-weight: 600; }

/* anchors */
.anchors { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.anchor { position: absolute; left: 0; top: 0; will-change: transform; pointer-events: auto; }
.tag { transform: translate(-50%, -100%); display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px 5px 8px; border-radius: 9px; font-size: 12px; font-weight: 600; letter-spacing: .03em; white-space: nowrap; cursor: pointer;
  background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--hair-2); box-shadow: 0 10px 24px -10px rgba(0,0,0,.45); color: var(--text); }
.tag::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 1px; height: 9px; background: currentColor; opacity: .6; }
.tag .ico { width: 14px; height: 14px; }
.tag .mono { font-weight: 600; }
.tag.t-crit { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 55%, transparent); }
.tag.t-esc { color: #fff; background: var(--esc); border-color: var(--esc); }
.tag.t-hold { color: var(--hold); border-color: color-mix(in srgb, var(--hold) 45%, transparent); font-size: 11px; }
.tag.t-warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
.tag .k { color: var(--text); }
.tag.t-esc .k { color: #fff; }
.hovercard { position: absolute; z-index: 20; pointer-events: none; min-width: 220px; max-width: 290px; padding: 12px 14px; }
.hovercard dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 8px 0 0; font-size: 12px; }
.hovercard dt { color: var(--muted); } .hovercard dd { margin: 0; text-align: right; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.chip .ico { width: 13px; height: 13px; }
.c-ok { color: var(--ok); } .c-warn { color: var(--warn); } .c-crit { color: var(--crit); } .c-esc { color: var(--esc); } .c-hold { color: var(--hold); } .c-transit { color: var(--transit); } .c-paused { color: var(--paused); } .c-muted { color: var(--muted); } .c-text { color: var(--text); }

/* inspector */
.inspector { top: 80px; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(132px + env(safe-area-inset-bottom, 0px)); width: min(400px, calc(100vw - 32px)); display: flex; flex-direction: column; overflow: hidden; z-index: 14; }
.insp-head { padding: 16px 16px 14px 18px; display: flex; gap: 10px; align-items: flex-start; border-bottom: 1px solid var(--hair); }
.insp-head .id { font-family: var(--font-mono); font-size: 26px; font-weight: 600; line-height: 1.05; margin-top: 4px; }
.insp-head .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.insp-body { overflow: auto; padding: 16px 18px 20px; display: grid; gap: 20px; align-content: start; }
.sec { display: grid; gap: 10px; }
.sec > .micro { display: flex; justify-content: space-between; gap: 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; min-width: 0; overflow-wrap: anywhere; }
.timer { display: grid; grid-template-columns: 88px 1fr; gap: 16px; align-items: center; }
.timer .num { font-size: 44px; }
.timer .of { color: var(--muted); font-size: 13px; margin-top: 6px; }
.timer .delta { font-size: 14px; font-weight: 600; margin-top: 6px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; }
.checks li { display: grid; grid-template-columns: 18px 1fr; gap: 9px; }
.checks .why { display: block; color: var(--muted); font-size: 12px; }
.callout { border-radius: 10px; padding: 11px 13px; font-size: 13px; background: var(--fill); display: grid; gap: 5px; border-left: 3px solid var(--hair-2); }
.callout.crit { border-left-color: var(--crit); background: color-mix(in srgb, var(--crit) 8%, var(--fill)); }
.callout.hold { border-left-color: var(--hold); background: color-mix(in srgb, var(--hold) 8%, var(--fill)); }
.callout.warn { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, var(--fill)); }
.callout .ttl { font-weight: 700; display: flex; gap: 7px; align-items: center; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.linkish { background: none; border: 0; padding: 0; color: var(--text); font-family: var(--font-mono); font-weight: 600; text-decoration: underline; text-decoration-color: var(--hair-2); text-underline-offset: 3px; }
.linkish:hover { text-decoration-color: var(--text); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.timeline { list-style: none; margin: 0; padding: 0; font-size: 12px; }
.timeline li { display: grid; grid-template-columns: 50px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--hair); }
.timeline li:first-child { border-top: 0; }
.timeline .tm { font-family: var(--font-mono); color: var(--muted); }
.build { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.build li { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; font-size: 13px; padding: 5px 0; }
.build .st { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.build .pg { width: 56px; height: 3px; border-radius: 2px; background: var(--hair); overflow: hidden; }
.build .pg i { display: block; height: 100%; background: var(--text); }
.build li.done { color: var(--text-2); }
.build li.now { font-weight: 600; }
.build li.now .pg i { background: var(--transit); }
.build li.todo { color: var(--muted); }
.route { display: flex; gap: 3px; align-items: flex-end; }
.route .s { flex: 1; min-width: 0; height: 6px; border-radius: 2px; background: var(--hair); }

/* ═════════ navigation, pages, sign-in, settings ═════════ */

.page-shell { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }

.r-admin { background: #c8102e !important; } .r-authorised { background: #0f8ea6 !important; } .r-supervisor { background: var(--call-sup) !important; } .r-maintenance { background: var(--call-mnt) !important; } .r-viewer { background: #6e7b88 !important; }
.umenu { position: relative; display: flex; align-items: center; padding: 0 12px; }

/* sign-in */

.si-brand { position: relative; display: flex; flex-direction: column; gap: 28px; padding: 44px 52px; color: #e8edf2; background: radial-gradient(120% 90% at 0% 0%, #1d2731 0%, #0d1217 55%, #080b0e 100%); overflow: hidden; }
.si-brand::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 0 39px, rgba(255,255,255,.035) 39px 40px) 0 0 / 40px 40px, linear-gradient(0deg, transparent 0 39px, rgba(255,255,255,.035) 39px 40px) 0 0 / 40px 40px; pointer-events: none; }
.si-brand > * { position: relative; z-index: 1; }
.si-top { display: flex; align-items: center; gap: 12px; }

.si-call { animation: lamp-blink 1s steps(2, start) infinite; } .si-call.c-sup { fill: #b394ff; } .si-call.c-mnt { fill: #4fb4ff; }

.si-alt { height: 48px !important; justify-content: center; position: relative; }
.si-soon { position: absolute; right: 10px; top: -9px; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; padding: 2px 6px; background: var(--bg); border: 1px solid var(--hair-2); color: var(--muted); }
.si-demo { border: 1px dashed var(--hair-2); }
.si-demo-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; background: transparent; border: 0; color: var(--text); font: 600 12px/1 var(--font-ui); letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
.si-demo-h span:first-child { display: inline-flex; align-items: center; gap: 8px; } .si-demo-h .c-muted { font: 400 12px/1 var(--font-ui); letter-spacing: 0; text-transform: none; }
.si-accts { display: grid; gap: 2px; padding: 0 8px 8px; }
.si-acct { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 8px 8px; background: transparent; border: 1px solid transparent; color: var(--text); text-align: left; cursor: pointer; }
.si-acct:hover, .si-acct:focus-visible { border-color: var(--hair-2); background: var(--fill); }
.si-acct .nm { display: grid; gap: 2px; } .si-acct small { color: var(--text-2); font-size: 12px; }
.si-note { margin: 0; padding: 0 14px 12px; color: var(--text-2); font-size: 12.5px; }
.si-fine { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
@media (max-width: 980px) { .signin { grid-template-columns: 1fr; } .si-brand { padding: 24px 20px; gap: 16px; } .si-hero h1 { font-size: 26px; } .si-hero p, .si-flow, .si-foot { display: none; } .si-hero { margin-top: 4px; } }
/* settings */
.admin { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; align-items: start; }
.adm-nav { position: sticky; top: 16px; display: grid; gap: 2px; }

.adm-tab:hover { color: var(--text); background: var(--fill); }

.plan-grid { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }

.plan-day { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px; background: transparent; border: 1px solid transparent; color: var(--text); font: 500 13px/1 var(--font-ui); cursor: pointer; text-align: left; }

.si-brand { justify-content: space-between; gap: 18px; }
.si-hero { margin-top: 0; }

/* ═════════ dashboard ═════════ */
.dash-live { display: flex; align-items: center; gap: 10px; max-width: 560px; font-size: 13px; color: var(--text-2); }
.livedot { width: 9px; height: 9px; border-radius: 50% !important; background: var(--ok); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); animation: livep 2s infinite; flex: none; }
@keyframes livep { 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
.dash-grid.stale .dash-lines, .dash-grid.stale .dash-side { filter: grayscale(.7); opacity: .75; }
.dash-lines, .dash-side { display: grid; gap: 16px; }
.pg-row { display: flex; justify-content: space-between; align-items: baseline; }
.panel h3 { margin: 0 0 4px; }
.dash-kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--hair); font-size: 13px; color: var(--text-2); }
.lcard { display: grid; gap: 14px; border-left: 3px solid var(--hair-2); }
.lcard.s-normal { border-left-color: var(--andon-ok); } .lcard.s-near { border-left-color: var(--warn); } .lcard.s-over, .lcard.s-STOP { border-left-color: var(--crit); } .lcard.s-PLANNED { border-left-color: var(--paused); }
.lc-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

.lc-st { display: grid; gap: 4px; }

.lc-cell .id .bz { color: var(--crit); margin-left: auto; } .lc-cell .id .ico { width: 12px; height: 12px; }
.lc-cell .cy { font: 400 15px/1 var(--font-mono); color: var(--text-2); }
.lc-cell.s-normal { border-top-color: var(--andon-ok); } .lc-cell.s-near { border-top-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--fill)); }
.lc-cell.s-over { border-top-color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, var(--fill)); } .lc-cell.s-over .cy { color: var(--crit); }

.spark { display: inline-flex; align-items: end; gap: 3px; height: 26px; }

@media (max-width: 1100px) { .dash-grid { grid-template-columns: 1fr; } .lc-kpis { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 560px) { .lc-st { grid-template-columns: repeat(4, 1fr) !important; } }
/* ═════════ line display (TV) ═════════ */
.lcd { position: absolute; inset: 0; z-index: 70; display: grid; gap: 1.2vh; padding: 2vh 2vw; background: #07090b; color: #eef2f5; font-family: var(--font-ui); overflow: hidden; }

.lcd-line { font-size: 5.2vh; font-weight: 600; letter-spacing: -.01em; line-height: 1; }
